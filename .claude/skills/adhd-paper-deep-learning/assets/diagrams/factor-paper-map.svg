<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 650" width="1450" height="650" role="img" aria-labelledby="title desc"><title id="title">因子论文教学流程地图</title><desc id="desc">截图内容仅显示：第二章、3.1、3.2至3.8和第四章；可见四段的职责与衔接；编号矛盾需核实。</desc><rect x="0" y="0" width="1450" height="650" rx="24" fill="#f8f6f1" stroke="none" stroke-width="0" /><text x="64" y="56" fill="#2f827a" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" text-anchor="start" letter-spacing="1">PAPER GPS  /  EXAMPLE</text><text x="64" y="110" fill="#24424d" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="36" font-weight="750" text-anchor="start">从检验方法到多因子模型</text><text x="64" y="148" fill="#59717b" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="400" text-anchor="start">将截图中的章节片段整理成可看、可走、可定位的结构地图</text><line x1="64" y1="173" x2="1386" y2="173" stroke="#d9e1db" stroke-width="2" /><rect x="56" y="208" width="288" height="252" rx="20" fill="#fffefa" stroke="#d9e1db" stroke-width="1.2" /><rect x="74" y="230" width="46" height="40" rx="11" fill="#f2ede2" stroke="none" stroke-width="0" /><text x="97" y="257" fill="#24424d" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="700" text-anchor="middle">01</text><text x="76" y="315" fill="#24424d" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="750" text-anchor="start">第二章：</text><text x="76" y="346" fill="#24424d" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="750" text-anchor="start">怎样检验因子</text><text x="76" y="385" fill="#59717b" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="400" text-anchor="start">先明确：因子如何被</text><text x="76" y="411" fill="#59717b" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="400" text-anchor="start">检验与评价？</text><line x1="76" y1="427" x2="324" y2="427" stroke="#d9e1db" stroke-width="1" /><text x="76" y="450" fill="#59717b" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" text-anchor="start">角色：提出总体任务</text><rect x="402" y="208" width="288" height="252" rx="20" fill="#e7f2f2" stroke="#2f827a" stroke-width="2.5" /><rect x="420" y="230" width="46" height="40" rx="11" fill="#2f827a" stroke="none" stroke-width="0" /><text x="443" y="257" fill="#fffefa" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="700" text-anchor="middle">02</text><text x="422" y="315" fill="#24424d" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="750" text-anchor="start">3.1 数据和流程</text><text x="422" y="385" fill="#59717b" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="400" text-anchor="start">当时可用的信息？</text><text x="422" y="411" fill="#59717b" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="400" text-anchor="start">筛选、分组、调仓？</text><line x1="422" y1="427" x2="670" y2="427" stroke="#d9e1db" stroke-width="1" /><text x="422" y="450" fill="#2f827a" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" text-anchor="start">角色：统一检验口径</text><rect x="748" y="208" width="288" height="252" rx="20" fill="#fffefa" stroke="#d9e1db" stroke-width="1.2" /><rect x="766" y="230" width="46" height="40" rx="11" fill="#f2ede2" stroke="none" stroke-width="0" /><text x="789" y="257" fill="#24424d" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="700" text-anchor="middle">03</text><text x="768" y="315" 