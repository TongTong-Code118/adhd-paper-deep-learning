crosoft YaHei', sans-serif" font-size="17" font-weight="400" text-anchor="start">进入组合建模</text><line x1="1114" y1="427" x2="1362" y2="427" stroke="#d9e1db" stroke-width="1" /><text x="1114" y="450" fill="#59717b" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" text-anchor="start">角色：衔接下一主题</text><path d="M 349 340 L 386 340" stroke="#2f827a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none" /><path d="M 381 333 L 390 340 L 381 347" stroke="#2f827a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none" /><text x="373.5" y="496" fill="#59717b" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" text-anchor="middle">明确如何检验</text><path d="M 695 340 L 732 340" stroke="#2f827a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none" /><path d="M 727 333 L 736 340 L 727 347" stroke="#2f827a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none" /><text x="719.5" y="496" fill="#59717b" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" text-anchor="middle">提供可比证据</text><path d="M 1041 340 L 1078 340" stroke="#2f827a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none" /><path d="M 1073 333 L 1082 340 L 1073 347" stroke="#2f827a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none" /><text x="1065.5" y="496" fill="#59717b" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" text-anchor="middle">进入组合思路</text><rect x="56" y="528" width="1338" height="75" rx="16" fill="#f2ede2" stroke="none" stroke-width="0" /><circle cx="82" cy="566" r="7" fill="#d77757" /><text x="102" y="561" fill="#24424d" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700" text-anchor="start">来源提醒</text><text x="102" y="585" fill="#59717b" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="400" text-anchor="start">截图写“第二章”，小节却标为“3.1–3.8”；图按截图原文保留，具体章号仍需回论文核对。</text></svg>