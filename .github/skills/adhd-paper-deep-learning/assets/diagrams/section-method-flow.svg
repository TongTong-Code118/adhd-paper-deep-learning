<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 650" width="1450" height="650" role="img" aria-labelledby="title desc"><title id="title">3.1 小节流程图</title><desc id="desc">基于用户截图中的3.1描述，分出信息可用性、筛选、分组、调仓四项阅读任务。</desc><rect x="0" y="0" width="1450" height="650" rx="24" fill="#f8f6f1" stroke="none" stroke-width="0" /><text x="64" y="56" fill="#2f827a" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" text-anchor="start" letter-spacing="1">SECTION ENTRY  /  3.1</text><text x="64" y="110" fill="#24424d" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="36" font-weight="750" text-anchor="start">3.1 数据和流程：一条检验规则链</text><text x="64" y="148" fill="#59717b" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="400" text-anchor="start">看懂这一节，不是先背术语，而是明白每一步解决哪个检验问题</text><line x1="64" y1="173" x2="1386" y2="173" stroke="#d9e1db" stroke-width="2" /><rect x="72" y="210" width="256" height="252" rx="20" fill="#e7f2f2" stroke="#2f827a" stroke-width="2.5" /><rect x="90" y="232" width="46" height="40" rx="11" fill="#2f827a" stroke="none" stroke-width="0" /><text x="113" y="259" fill="#fffefa" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="700" text-anchor="middle">01</text><text x="92" y="317" fill="#24424d" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="750" text-anchor="start">信息可用性</text><text x="92" y="387" fill="#59717b" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="400" text-anchor="start">哪些信息在当时</text><text x="92" y="413" fill="#59717b" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="400" text-anchor="start">确实已经可用？</text><line x1="92" y1="429" x2="308" y2="429" stroke="#d9e1db" stroke-width="1" /><text x="92" y="452" fill="#2f827a" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" text-anchor="start">避免混用事后信息</text><rect x="422" y="210" width="256" height="252" rx="20" fill="#fffefa" stroke="#d9e1db" stroke-width="1.2" /><rect x="440" y="232" width="46" height="40" rx="11" fill="#f2ede2" stroke="none" stroke-width="0" /><text x="463" y="259" fill="#24424d" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="700" text-anchor="middle">02</text><text x="442" y="317" fill="#24424d" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="750" text-anchor="start">股票筛选</text><text x="442" y="387" fill="#59717b" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="400" text-anchor="start">哪些股票被纳入？</text><text x="442" y="413" fill="#59717b" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="400" text-anchor="start">筛选条件是什么？</text><line x1="442" y1="429" x2="658" y2="429" stroke="#d9e1db" stroke-width="1" /><text x="442" y="452" fill="#59717b" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" text-anchor="start">界定比较对象</text><rect x="772" y="210" width="256" height="252" rx="20" fill="#fffefa" stroke="#d9e1db" stroke-width="1.2" /><rect x="790" y="232" width="46" height="40" rx="11" fill="#f2ede2" stroke="none" stroke-width="0" /><text x="813" y="259" fill="#24424d" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="700" text-anchor="middle">03</text><text x="792" y="317" fill="#24424d" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="750" text-anchor="start">分组方式</text><text x="792" y="387" fill="#59717b" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="400" text-anchor="start">按什么规则分组？</text><text x="792" y="413" fill="#59717b" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="400" text-anchor="start">如何保证可比较？</text><line x1="792" y1="429" x2="1008" y2="429" stroke="#d9e1db" stroke-width="1" /><text x="792" y="452" fill="#59717b" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" text-anchor="start">明确测试方法</text><rect x="1122" y="210" width="256" height="252" rx="20" fill="#fffefa" stroke="#d9e1db" stroke-width="1.2" /><rect x="1140" y="232" width="46" height="40" rx="11" fill="#f2ede2" stroke="none" stroke-width="0" /><text x="1163" y="259" fill="#24424d" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="700" text-anchor="middle">04</text><text x="1142" y="317" fill="#24424d" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="750" text-anchor="start">调仓规则</text><text x="1142" y="387" fill="#59717b" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="400" text-anchor="start">什么时候调整？</text><text x="1142" y="413" fill="#59717b" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="400" text-anchor="start">调整后观察什么？</text><line x1="1142" y1="429" x2="1358" y2="429" stroke="#d9e1db" stroke-width="1" /><text x="1142" y="452" fill="#59717b" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" text-anchor="start">明确动态执行</text><path d="M 335 333 L 398 333" stroke="#2f827a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none" /><path d="M 393 326 L 402 333 L 393 340" stroke="#2f827a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none" /><text x="372.5" y="495" fill="#59717b" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" text-anchor="middle">先确定输入</text><path d="M 685 333 L 748 333" stroke="#2f827a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none" /><path d="M 743 326 L 752 333 L 743 340" stroke="#2f827a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none" /><text x="722.5" y="495" fill="#59717b" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" text-anchor="middle">再定义样本</text><path d="M 1035 333 L 1098 333" stroke="#2f827a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none" /><path d="M 1093 326 L 1102 333 L 1093 340" stroke="#2f827a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none" /><text x="1072.5" y="495" fill="#59717b" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" text-anchor="middle">再规定操作</text><rect x="72" y="534" width="1306" height="65" rx="16" fill="#f2ede2" stroke="none" stroke-width="0" /><text x="96" y="560" fill="#24424d" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700" text-anchor="start">本节的价值</text><text x="239" y="560" fill="#2f827a" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="600" text-anchor="start">给后面七类因子的检验建立统一的提问框架。</text><text x="96" y="585" fill="#59717b" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="400" text-anchor="start">教学阅读顺序示意；截图片段不足以证实各步骤在原文中的确切先后与全部操作细节。</text></svg>