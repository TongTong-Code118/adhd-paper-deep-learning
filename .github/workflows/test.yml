name: Test Agent Skill and MCP tools
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install a Chinese-capable system font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Install package in editable mode
        run: python -m pip install -e .
      - name: Verify canonical skill mirrors
        run: python scripts/sync_platform_skills.py --check
      - name: Validate files and configurations
        run: python scripts/validate_repo.py
      - name: Run protocol and rendering tests
        run: python -m unittest discover -s tests -v
      - name: Generate five image previews
        run: python scripts/demo.py
